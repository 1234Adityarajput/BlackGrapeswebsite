<!doctype html>
<html lang="en" class="dark bgst-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bgst-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Grapes Softech | Innovate, Integrate, Elevate - Best IT & Software Company</title>
    <meta name="description" content="Black Grapes Softech is the leading website development, mobile app development, MLM software, CRM, and digital marketing company in Indore with 10+ years of tech excellence." />
    <meta name="keywords" content="Black Grapes Softech, website development Indore, mobile app development, software development company, MLM software Indore, CRM development, game development" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Black Grapes Softech | Next-Gen IT Solutions" />
    <meta property="og:description" content="Innovate. Integrate. Elevate. Digitalize your ideas into success with top-tier software and mobile app engineering." />
    <meta property="og:image" content="/bgst-logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- 0ms First-Paint Cinematic Loader Styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #030206;
        color: #ffffff;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      #bgst-initial-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        z-index: 9999999;
        background: radial-gradient(circle at center, #0e071c 0%, #030206 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #bgst-initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .init-loader-ambient {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(248, 98, 0, 0.22) 0%, rgba(147, 51, 234, 0.15) 50%, transparent 70%);
        filter: blur(65px);
        pointer-events: none;
        animation: initPulse 3.5s ease-in-out infinite;
      }

      .init-loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }

      .init-logo-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        animation: initLogoEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .init-logo-glow {
        position: absolute;
        inset: -10px;
        border-radius: 28px;
        background: radial-gradient(circle, rgba(248, 98, 0, 0.4) 0%, rgba(147, 51, 234, 0.25) 60%, transparent 100%);
        filter: blur(16px);
        animation: initPulse 2.8s infinite ease-in-out;
      }

      .init-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.8));
      }

      .init-brand-title {
        font-size: 1.28rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
        animation: initFadeUp 0.8s ease 0.2s forwards;
        opacity: 0;
      }

      .init-brand-white {
        color: #ffffff;
      }

      .init-brand-orange {
        background: linear-gradient(135deg, #f86200 0%, #ff9e42 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .init-tagline {
        font-size: 0.8rem;
        color: #94a3b8;
        letter-spacing: 0.06em;
        margin: 0 0 1.8rem;
        animation: initFadeUp 0.8s ease 0.3s forwards;
        opacity: 0;
      }

      .init-progress-track {
        width: 260px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
        animation: initFadeUp 0.8s ease 0.4s forwards;
        opacity: 0;
      }

      .init-progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #9333ea 0%, #f86200 50%, #ff9e42 100%);
        border-radius: 8px;
        transition: width 0.15s ease-out;
        box-shadow: 0 0 14px rgba(248, 98, 0, 0.9);
      }

      @keyframes initLogoEntrance {
        0% {
          opacity: 0;
          transform: scale(0.8) translateY(16px);
          filter: blur(10px);
        }
        60% {
          opacity: 1;
          transform: scale(1.04) translateY(0);
          filter: blur(0);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }

      @keyframes initFadeUp {
        0% {
          opacity: 0;
          transform: translateY(12px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes initPulse {
        0%, 100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.08);
        }
      }
    </style>
  </head>
  <body>
    <!-- 0ms First-Paint Cinematic Branded Intro Screen -->
    <div id="bgst-initial-loader" role="status" aria-label="Loading Black Grapes Softech">
      <div class="init-loader-ambient" aria-hidden="true"></div>
      <div class="init-loader-content">
        <div class="init-logo-wrap">
          <div class="init-logo-glow"></div>
          <img src="/bgst-logo.png" alt="Black Grapes Softech Logo" class="init-logo-img" />
        </div>
        <div class="init-brand-title">
          <span class="init-brand-white">BLACK GRAPES</span>
          <span class="init-brand-orange"> SOFTECH</span>
        </div>
        <p class="init-tagline">Engineering Next-Gen Digital Products</p>
        <div class="init-progress-track">
          <div class="init-progress-bar" id="init-loader-bar"></div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var loader = document.getElementById('bgst-initial-loader');
        var bar = document.getElementById('init-loader-bar');
        if (!loader) return;

        var progress = 15;
        var pInterval = setInterval(function() {
          progress += Math.floor(Math.random() * 15) + 10;
          if (progress >= 95) {
            progress = 95;
            clearInterval(pInterval);
          }
          if (bar) bar.style.width = progress + '%';
        }, 90);

        var isDismissed = false;
        function dismissLoader() {
          if (isDismissed) return;
          isDismissed = true;
          clearInterval(pInterval);
          if (bar) bar.style.width = '100%';
          setTimeout(function() {
            if (loader) {
              loader.classList.add('loader-hidden');
              document.documentElement.classList.remove('bgst-loading');
              document.documentElement.classList.add('bgst-loaded');
              window.__bgstLoaded = true;
              try {
                window.dispatchEvent(new CustomEvent('bgst:loaded'));
              } catch (e) {}
              setTimeout(function() {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 650);
            }
          }, 180);
        }

        window.__dismissBgstLoader = dismissLoader;
        setTimeout(dismissLoader, 1300);
        setTimeout(dismissLoader, 2500);
      })();
    </script>

    <!-- Main React Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
